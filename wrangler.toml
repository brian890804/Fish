name = "fish-log"
main = "worker/index.ts"
compatibility_date = "2025-10-01"

# 前端打包結果由同一個 Worker 提供；/api/* 先進 Worker，其餘走 SPA
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 每 20 分鐘抓一次天氣預報（UTC 時間觸發，與時區無關）
[triggers]
crons = ["*/20 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fish-db"
database_id = "LOCAL_PLACEHOLDER"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "fish-photos"

# APP_PASSWORD 用 `wrangler secret put APP_PASSWORD` 設定，本地開發放 .dev.vars
