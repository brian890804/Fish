name = "fishing"
main = "worker/index.ts"
compatibility_date = "2025-10-01"

# 前端打包結果由同一個 Worker 提供；/api/* 先進 Worker，其餘走 SPA
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 每 20 分鐘抓一次天氣預報（UTC 時間觸發，與時區無關）
[triggers]
crons = ["*/20 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "fish-db"
database_id = "5e434065-7f13-4828-94ae-938f1be5edad"
migrations_dir = "migrations"
