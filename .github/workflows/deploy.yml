# push 到 main 就自動建置並部署到 Cloudflare（前端 + Worker API + D1 migration）
name: Deploy to Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FORCE_COLOR: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # 失敗時把 wrangler 的錯誤寫成 annotation，在 Actions 首頁就看得到原因
      - name: Check Cloudflare secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error title=缺少 secret::CLOUDFLARE_API_TOKEN 沒有設定"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error title=缺少 secret::CLOUDFLARE_ACCOUNT_ID 沒有設定"; exit 1; }
          echo "::notice title=Cloudflare 帳號::Account ID 長度 ${#CLOUDFLARE_ACCOUNT_ID}，開頭 ${CLOUDFLARE_ACCOUNT_ID:0:4}（應為 32 碼、4647 開頭）"

      - name: Apply D1 migrations
        run: |
          pnpm exec wrangler d1 migrations apply fish-db --remote > out.txt 2>&1 || {
            cat out.txt
            echo "::error title=D1 migration 失敗::$(grep -v '^$' out.txt | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }
          cat out.txt

      - name: Deploy Worker
        run: |
          pnpm exec wrangler deploy > out.txt 2>&1 || {
            cat out.txt
            echo "::error title=部署失敗::$(grep -v '^$' out.txt | tail -n 15 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          }
          cat out.txt
